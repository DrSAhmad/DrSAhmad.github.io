<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Dr. S. Ahmad</title>
<style>
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.7;color:#1f2937;max-width:800px;margin:0 auto;padding:24px 20px 60px;background:#f8fafc}
  .card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  h1{color:#0d5c46;margin-top:0}a{color:#0d5c46}
  label{display:block;font-weight:600;margin:14px 0 4px}
  input,textarea{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font:inherit}
  textarea{min-height:130px}button{margin-top:18px;background:#0d5c46;color:#fff;border:0;border-radius:8px;padding:12px 26px;font:inherit;font-weight:700;cursor:pointer}
  header{background:#0d5c46;padding:14px 0;margin:-24px -20px 24px}
  header nav{max-width:800px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
  header a{color:#fff;text-decoration:none;font-weight:700}header nav div a{margin-left:16px;font-weight:500;font-size:.93rem}
</style>
</head>
<body>
<header><nav><a href="/">Dr. S. Ahmad</a><div><a href="/about.html">About</a><a href="/contact.html">Contact</a><a href="/privacy.html">Privacy</a></div></nav></header>
<div class="card">
  <h1>Contact</h1>
  <p>Questions about any project, collaboration ideas, or feedback — send a message. It opens your own email app, so nothing is stored on this page.</p>
  <form id="cf">
    <label for="name">Your name</label><input id="name" required>
    <label for="topic">Topic</label>
    <input id="topic" placeholder="e.g. Zubaan feedback, book enquiry…">
    <label for="msg">Message</label><textarea id="msg" required></textarea>
    <button type="submit">Open email app to send</button>
  </form>
  <p style="margin-top:24px"><a href="/">← Back to home</a></p>
</div>
<script>
document.getElementById('cf').addEventListener('submit',function(e){e.preventDefault();
var n=document.getElementById('name').value.trim(),t=document.getElementById('topic').value.trim(),m=document.getElementById('msg').value.trim();
location.href='mailto:?subject='+encodeURIComponent('['+(t||'Website enquiry')+'] — '+n)+'&body='+encodeURIComponent('Name: '+n+'\nTopic: '+t+'\n\n'+m);});
</script>
</body>
</html>
